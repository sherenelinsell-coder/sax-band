<html lang="zh-Hant">
<head>

<title>金手獎薩克斯風樂團活動簿</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<style>
/* Layout: one narrow column like a sign-up sheet; date stub on the left of each event, roster below. */
:root{
  --bg:#fbf3e4; --surface:#fffdf8; --ink:#574334; --muted:#8a7461; --line:#ecdcc4;
  --brass:#bf5b43; --brass-soft:#fde8a6; --sun-ink:#6b4a16; --hol:#d2452f; --go:#4a8351; --go-soft:#e3f0d9; --leave:#bd533c; --leave-soft:#fbe3da;
  --bun:#fffaf0; --bun-line:#8a6a52; --bun-in:#f6bfb0;
  --display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(var(--line) 1.3px,transparent 1.5px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 170px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h2{font-family:var(--display);font-weight:900;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.who{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:100%}
textarea{width:100%;min-height:96px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.primary{background:var(--brass);color:var(--surface);border-color:var(--brass);font-weight:700}
.link{border:0;border-radius:4px;background:none;padding:4px 0;color:var(--brass);font-weight:500;text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--brass-soft);border-color:var(--brass-soft);color:var(--sun-ink);font-weight:700}
.list{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:76px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ev.past{opacity:.72}
.stub{background:var(--brass-soft);color:var(--sun-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums}
.stub b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.stub span{font-size:.75rem;font-weight:700}
.evb{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.evt{border:0;border-radius:0;background:none;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--ink)}
.meta{color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;gap:2px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums}
.cnt.go{background:var(--go-soft);color:var(--go)} .cnt.lv{background:var(--leave-soft);color:var(--leave)} .cnt.no{border:1px dashed var(--line);color:var(--muted)} .cnt.solo{background:var(--brass-soft);color:var(--sun-ink)}
.lab{font-size:.85rem;color:var(--muted)} .mem button{padding:4px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px;font-size:.9rem}
.seg button+button{border-left:1px solid var(--line)}
.seg .on.go{background:var(--go);color:var(--bg);font-weight:700}
.seg .on.lv{background:var(--leave);color:var(--bg);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:.875rem;white-space:nowrap} dd{margin:0;min-width:0;overflow-wrap:anywhere}
ol.songs{margin:0;padding-left:1.6em;columns:2;column-gap:24px} pre{font:inherit;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.mem .n{flex:1;min-width:0} .mem .no{color:var(--muted);font-variant-numeric:tabular-nums;width:1.8em}
.part{font-size:.75rem;color:var(--muted);margin-left:6px}
.note{color:var(--muted);font-size:.875rem}
.warn{background:var(--brass-soft);color:var(--sun-ink);border-radius:14px;padding:10px 14px;font-size:.9rem}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
form.f .w{grid-column:1/-1} form.f input,form.f select{width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal div{background:var(--surface);min-height:58px;padding:4px;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:0}
.cal .hd{min-height:0;text-align:center;color:var(--muted);font-weight:700;padding:6px 0}
.cal .out{background:var(--bg)} .cal .today{box-shadow:inset 0 0 0 2px var(--brass)}
.cal .red{color:var(--hol)} .cal small{display:block;font-size:.65rem;line-height:1.2}
.cal button{display:block;width:100%;border:0;background:var(--brass-soft);color:var(--sun-ink);border-radius:8px;padding:2px 4px;margin-top:2px;font-size:.72rem;font-weight:700;text-align:left;overflow-wrap:anywhere;line-height:1.3}
@media (max-width:520px){ form.f{grid-template-columns:1fr} ol.songs{columns:1} .ev{grid-template-columns:64px 1fr} }
.ev,.panel{border-width:2px;border-radius:22px;box-shadow:0 4px 0 var(--line)}
button,input,select,textarea{border-width:2px}
.banner{display:block;width:100%;aspect-ratio:5/2;object-fit:cover;object-position:50% 62%;border-radius:22px;border:2px solid var(--line)}
#addBtn{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;background:radial-gradient(circle at 35% 30%,#d9664e,#a63d2a);border-color:#8f3423;color:#fffdf8;border-radius:50%;padding:0;font-size:1.9rem;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:5}
.hero{display:flex;align-items:center;gap:10px;min-width:0} .hero svg{width:56px;height:56px;flex:none}
.foot{display:flex;justify-content:center;align-items:flex-end;gap:12px;padding-top:8px} .foot svg{width:36px;height:36px} .foot svg:nth-child(3){width:52px;height:52px}
.bf{fill:var(--bun);stroke:var(--bun-line);stroke-width:2} .bi{fill:var(--bun-in)} .bl{fill:none;stroke:var(--bun-line);stroke-width:2;stroke-linecap:round} .bn{fill:var(--bun-line)} .bc{fill:var(--bun-in);opacity:.75}
.hero{justify-content:space-between} .hero h1{min-width:0}
.hero img{width:104px;flex:none;border-radius:50%;-webkit-mask-image:radial-gradient(ellipse at center,#000 52%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 52%,transparent 72%)}
.floor{display:block;width:100%;max-width:460px;margin:8px auto 0;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 6%),linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 6%),linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}
.panel{outline:2px dashed var(--line);outline-offset:-7px}
.who input{border-style:dashed;border-color:var(--bun-line);background:var(--surface)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
.nav button{flex:1;max-width:150px;min-width:0;border:0;background:none;border-radius:16px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--muted);white-space:nowrap}
.nav button span{font-size:1.4rem;line-height:1.25}
.nav button[aria-selected="true"]{background:var(--brass-soft);color:var(--sun-ink);font-weight:700}
.paste{background:var(--brass-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;color:var(--sun-ink)} .paste textarea{min-height:120px}
.hd{position:relative;display:flex;flex-direction:column;gap:6px;margin-bottom:-4px}
.hd img{position:absolute;right:0;top:-8px;width:68px}
.hd h1,.hd .who{position:relative;z-index:1} .hd h1{font-size:1.25rem;letter-spacing:.02em}
.hd .who input{padding:4px 10px}
.floor{max-width:520px}
.nav{background:#f7f0dd} .nav button{padding:3px 2px} .nav button img{height:40px;width:auto;display:block}
.nav button[aria-selected="true"]{background:none;box-shadow:inset 0 -3px 0 var(--brass);border-radius:10px;color:var(--ink)}

:root{--sage:#5f7d5a;--sage-soft:#e4eddc;--blue:#4c6e8f;--blue-soft:#e2ebf3;--pink:#e0245e}
.ktag{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 9px;align-self:flex-start}
.ktag.k-practice,.ktag.k-ask,.ktag.k-invite{background:var(--sage-soft);color:var(--sage)}
.ktag.newtag{background:var(--accent,#bf5b43);color:#fff}
.stub.k-practice,.stub.k-ask,.stub.k-invite{background:var(--sage-soft);color:var(--sage)}
.cal button.k-practice,.cal button.k-ask,.cal button.k-invite{background:var(--sage-soft);color:var(--sage)}
.cal button.k-buy{background:var(--blue-soft);color:var(--blue)}
.nav button{position:relative}
.nav .emo{font-size:1.75rem;line-height:40px;height:40px;display:block}
.badge{position:absolute;top:0;right:calc(50% - 28px);background:var(--pink);color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.bcard{display:grid;grid-template-columns:96px 1fr;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);overflow:hidden}
.bcard .ph{background:#f3e9d8;min-height:96px;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.bcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.btag{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--blue-soft);color:var(--blue)}
.btag.closed{background:#eee3d3;color:var(--muted)}
.car{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px}
.car img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:contain;background:#f3e9d8;border-radius:16px;scroll-snap-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button.on{background:var(--brass-soft);border-color:#e9cf7a;color:var(--sun-ink);font-weight:700}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;border-radius:0;padding:4px 14px;font-weight:900}
.stepper span{min-width:2.2em;text-align:center;font-weight:700}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st th,table.st td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)} table.st th{color:var(--muted);font-size:.85rem} table.st .num{text-align:right}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs div{position:relative} .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;padding:0 7px;font-size:.8rem;background:var(--surface)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bun" viewBox="0 0 64 64">
<ellipse cx="22" cy="17" rx="7" ry="15" transform="rotate(-12 22 17)" class="bf"/><ellipse cx="42" cy="17" rx="7" ry="15" transform="rotate(12 42 17)" class="bf"/>
<ellipse cx="22" cy="18" rx="3" ry="9" transform="rotate(-12 22 18)" class="bi"/><ellipse cx="42" cy="18" rx="3" ry="9" transform="rotate(12 42 18)" class="bi"/>
<ellipse cx="32" cy="43" rx="22" ry="18" class="bf"/><circle cx="18" cy="48" r="3.5" class="bc"/><circle cx="46" cy="48" r="3.5" class="bc"/>
<path d="M21 42q3 3 6 0M37 42q3 3 6 0M32 49q-2 3-4.5 1.5M32 49q2 3 4.5 1.5" class="bl"/><path d="M30 46h4l-2 3z" class="bn"/></symbol></svg>

<div class="wrap">
  <header class="hd"><img src="sax.png" alt="" aria-hidden="true"><h1>金手獎薩克斯風樂團活動簿</h1>
  <label class="who" for="me">🐰 我是 <input id="me" list="meList" placeholder="輸入姓名" autocomplete="off" size="10"><datalist id="meList"></datalist></label></header>
  <button class="primary" data-act="new" id="addBtn" aria-label="新增活動" title="新增活動">＋</button>
  <div id="msg" class="warn" hidden></div>
  <div id="view"><p class="note">正在載入活動⋯ 載入後這裡會列出所有活動，點「參加」或「請假」就完成報名。</p></div>
  <img class="floor" src="scene.jpg" alt="" aria-hidden="true">
  <p class="note" style="text-align:center"><a href="guide.html" style="color:var(--brass);font-weight:700">使用說明</a></p>
</div>
<nav class="nav" role="tablist" aria-label="主要功能">
  <button data-tab="list" aria-selected="true"><img src="ic0.png" alt="" aria-hidden="true">活動總表<span class="badge" id="bd-list" hidden></span></button>
  <button data-tab="cal" aria-selected="false"><img src="ic1.png" alt="" aria-hidden="true">行事曆</button>
  <button data-tab="buy" aria-selected="false"><span class="emo" aria-hidden="true">🛍️</span>團購<span class="badge" id="bd-buy" hidden></span></button>
  <button data-tab="songs" aria-selected="false"><img src="ic2.png" alt="" aria-hidden="true">曲目庫</button>
  <button data-tab="members" aria-selected="false"><img src="ic3.png" alt="" aria-hidden="true">團員名單</button>
</nav>

<script>
(function(){
const $=s=>document.querySelector(s), view=$('#view'), msg=$('#msg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={events:{},members:{},rsvps:{},solos:{},buys:{},orders:{},buyView:null,buyForm:null,pick:{},qty:1,confirmBuy:null,calDay:null,unlocked:false,pw:null,tab:'list',detail:null,form:null,month:null,canWrite:true,loaded:false,confirmDel:null,copyText:null};
let me='';
const API=window.API_URL||'';
async function api(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  const j=await r.json(); if(!j.ok) throw {code:j.error||'unavailable'}; return j;
}
let pending=0;
async function write(op,col,id,data){
  if(op==='set') S[col][id]={...data,id}; else if(op==='update'&&S[col][id]) S[col][id]={...S[col][id],...data}; else if(op==='delete') delete S[col][id];
  render(); pending++;
  try{await api({op,col,id,data,pw:S.pwVal||'',who:me||''})}catch(e){pending--;await load();throw e}
  pending--;
}
const newId=c=>c[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const db={doc(path){const [col,id]=path.split('/');return {id,set:d=>write('set',col,id,d),update:d=>write('update',col,id,d),delete:()=>write('delete',col,id)}},
  collection(col){return {doc(id){return db.doc(col+'/'+(id||newId(col)))},add(d){const r=this.doc();return r.set(d).then(()=>r)}}}};
function purge(f,v){for(const c of ['rsvps','solos','orders'])for(const k of Object.keys(S[c]))if(S[c][k][f]===v)delete S[c][k]}
async function load(){
  try{const j=await api({op:'all'}); if(pending) return;
    for(const c of ['events','members','rsvps','solos','buys','orders']){const o={};(j.data[c]||[]).forEach(x=>o[x.id]=x);S[c]=o}
    initSeen(); S.loaded=true; render();
    try{localStorage.setItem('sax-cache',JSON.stringify(j.data))}catch(e){}
  }catch(e){if(!S.loaded){S.loaded=true;view.innerHTML='<p class="note">連不上資料，請檢查網路後重新整理。</p>'}}
}
try{me=localStorage.getItem('sax-me')||''}catch(e){}
const WD='日一二三四五六';
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const roc=s=>{const [y,m,d]=s.split('-');return (y-1911)+'.'+m+'.'+d};
const timeStr=e=>e.start?(e.end?e.start+'～'+e.end:e.start):'';

const KINDS={show:'演出',practice:'團練',ask:'詢問',invite:'其他邀請'};
const DEF_OPTS={show:'參加、請假',practice:'參加、請假',ask:'同意、不同意',invite:'參加、不參加'};
const kindOf=e=>KINDS[e.kind]?e.kind:'show';
const optsOf=e=>(e&&e.options&&e.options.length)?e.options:['參加','請假'];
const stOf=r=>!r?null:(r.status==='go'?'參加':r.status==='leave'?'請假':r.status);
const splitOpts=v=>String(v||'').split(/[、,，\/\s]+/).map(x=>x.trim()).filter(Boolean);
let SEEN=null;
function initSeen(){if(SEEN)return;try{const v=localStorage.getItem('sax-seen');if(v){SEEN=new Set(JSON.parse(v));return}}catch(e){}
  SEEN=new Set([...Object.keys(S.events),...Object.keys(S.buys)]);saveSeen()}
function saveSeen(){try{localStorage.setItem('sax-seen',JSON.stringify([...SEEN]))}catch(e){}}
function markSeen(id){if(SEEN&&!SEEN.has(id)){SEEN.add(id);saveSeen()}}
const isNew=id=>SEEN&&!SEEN.has(id);
const closedBuy=b=>!b.open||(b.deadline&&b.deadline<todayStr());
const canManage=b=>(me&&b.creator===me)||S.unlocked;
const photoUrl=(id,w)=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(w||1200);
const nameOf=id=>S.members[id]?S.members[id].name:'（已移除的團員）';
function evList(){return Object.values(S.events).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')))}
function memList(){return Object.values(S.members).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'zh-Hant'))}
function tally(eid){
  const e=S.events[eid], opts=optsOf(e), groups={}, no=[];
  opts.forEach(o=>groups[o]=[]);
  for(const m of memList()){const r=S.rsvps[eid+'_'+m.id]; if(!r){no.push(m);continue} const s=stOf(r); (groups[s]||(groups[s]=[])).push({m,r});}
  const byAt=(a,b)=>(a.r.at||0)-(b.r.at||0); Object.values(groups).forEach(g=>g.sort(byAt));
  const go=groups[opts[0]]||[], guests=go.reduce((n,x)=>n+(x.r.companions||0),0);
  return {opts,groups,no,guests,go,lv:groups[opts[1]]||[]};
}
function seg(eid,mid){
  const r=S.rsvps[eid+'_'+mid], st=stOf(r), dis=S.canWrite?'':' disabled', opts=optsOf(S.events[eid]);
  return `<span class="seg">${opts.map((o,i)=>`<button class="${st===o?(i?'on lv':'on go'):''}" data-act="rsvp" data-e="${eid}" data-m="${mid}" data-s="${esc(o)}"${dis}>${esc(o)}</button>`).join('')}</span>`;
}
function card(e){

  const d=new Date();let y=d.getFullYear();const s=y+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return (parse(s)<new Date(d.getFullYear(),d.getMonth()-2,d.getDate()))?(y+1)+s.slice(4):s}
function parseInto(txt){
  if(!txt.trim()){say('請先把接龍文字貼到框框裡。');return}
  const o={},songs=[],notes=[],bullets=[];let inSongs=false,inDress=false,solo=false,found=0;
  const lines=txt.replace(/\r/g,'').replace(/：/g,':').replace(/～/g,'~').split('\n');
  for(let raw of lines){
    const bm=raw.trim().match(/^[◦○●・]\s*(.+)$/);if(bm){bullets.push(bm[1].trim());continue}
    const line=raw.replace(/^[\s✅☑✔️⭐️▪•·\-–]+/u,'').trim(); if(!line){continue}
    if(/^[-—_=]{4,}/.test(raw.trim())||/可以參加|請接龍|^請假/.test(line)){inSongs=false;inDress=false;if(/可以參加|請接龍|^請假/.test(line))break;continue}
    if(/個人獨奏|獨奏\/重奏|獨奏／重奏/.test(line)&&!/^(曲目|時間)/.test(line)){solo=true;inSongs=false;continue}
    const f=line.match(/^(邀請單位|邀約單位|活動內容|活動名稱|邀請人|日期|日前|時間|集合時間|地點|攜伴|服裝|曲目)\s*:\s*(.*)$/);
    if(f){found++;const k=f[1],v=f[2].trim();inSongs=false;inDress=false;
      if(k==='邀請單位'||k==='邀約單位')o.unit=v;
      else if(k==='活動內容'||k==='活動名稱')o.title=v;
      else if(k==='邀請人')o.inviter=v;
      else if(k==='日期'||k==='日前')o.date=parseDate(v);
      else if(k==='時間'){const t=v.match(/\d{1,2}:\d{2}/g)||[];o.start=t[0]?hhmm(t[0]):'';o.end=t[1]&&/^\d{1,2}:\d{2}\s*[~\-－到至]\s*\d{1,2}:\d{2}/.test(v)?hhmm(t[1]):'';if(v.replace(/[\d:~\-－\s到至]/g,'').length)notes.push('時間：'+v)}
      else if(k==='集合時間')o.gather=v;
      else if(k==='地點')o.place=v;
      else if(k==='攜伴')o.companion=/⭕|○|〇|可|是|O|o|✔/.test(v)&&!/❌|✕|×|不|否|X|x/.test(v);
      else if(k==='服裝'){if(v){o.dressF=o.dressM=v}inDress=true}
      else if(k==='曲目'){o.songNote=v;inSongs=true}
      continue}
    const dr=line.match(/(女生|男生)\s*:\s*(.*)$/);
    if(dr){if(dr[2].trim())o[dr[1]==='女生'?'dressF':'dressM']=dr[2].trim();found++;continue}
    if(inSongs){const sm=line.match(/^\d{1,2}\s*[.、．)]\s*(.+)$/);if(sm){songs.push(sm[1].trim());continue}}
    if(/^📌/.test(line)){notes.push(line.replace(/^📌\s*/,''));continue}
  }
  if(!found){const all=txt.trim(),first=lines.map(l=>l.trim()).find(Boolean)||'';
    o.title=first.slice(0,40);o.date=parseDate(all);notes.splice(0,notes.length,all);
    o.kind=/團練|上課|練習|複習/.test(all)?'practice':'ask'}
  else if(bullets.length)o.kind=o.kind||'ask';
  if(o.kind){$('#f_kind').value=o.kind;$('#f_options').value=bullets.length?bullets.join('、'):DEF_OPTS[o.kind]}
  else if(bullets.length)$('#f_options').value=bullets.join('、');
  const set=(id,v)=>{const el=$('#'+id);if(el&&v!=null&&v!=='')el.value=v};
  set('f_title',o.title);set('f_unit',o.unit);set('f_inviter',o.inviter);set('f_date',o.date);set('f_gather',o.gather);set('f_start',o.start);set('f_end',o.end);set('f_place',o.place);set('f_songNote',o.songNote);set('f_dressF',o.dressF);set('f_dressM',o.dressM);
  if(o.companion!=null)$('#f_companion').value=o.companion?'1':'0';
  if(solo)$('#f_allowSolo').value='1';
  if(songs.length){S.form.songs=songs;$('#songEd').innerHTML=songEd()}
  if(notes.length){const n=$('#f_note');n.value=(n.value?n.value+'\n':'')+notes.join('\n')}
  saveDraft();
  say((found?'已自動填入':'這段不是接龍格式，已把全文放進備註、猜了日期和選項')+'，請往下檢查每個欄位，沒問題再按「儲存」。'+(solo?'（偵測到獨奏／重奏，已設為開放；節目表請團員自行新增。）':''));
  $('#f_title').scrollIntoView({block:'center'});
}
function gate(fn){if(S.unlocked)fn();else{S.pw=fn;render(true);const p=$('#pw');if(p)p.focus()}}
document.addEventListener('input',ev=>{
  if(ev.target.id!=='me') return; const v=ev.target.value.trim(), m=memList().find(x=>x.name===v), id=m?m.id:'';
  if(id===me) return; me=id; try{localStorage.setItem('sax-me',me)}catch(e){} render();
});
document.addEventListener('change',async ev=>{
  if(ev.target.id!=='b_photo')return;const files=[...ev.target.files].slice(0,8);ev.target.value='';if(!files.length)return;
  syncBuyForm();S.uploading=true;const m=$('#upMsg');let n=0;
  for(const f of files){n++;if(m)m.textContent='上傳照片中 '+n+'/'+files.length+'⋯ 請稍候';
    try{const data=await shrink(f);const j=await api({op:'upload',data});S.buyForm&&S.buyForm.photos.push(j.id);const t=$('#bfPhotos');if(t)t.innerHTML=thumbs(S.buyForm)}
    catch(e){if(m)m.textContent='有照片上傳失敗，請再試一次。'}}
  S.uploading=false;if(m&&m.textContent.startsWith('上傳照片中'))m.textContent='照片已上傳。';
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='f_song'){ev.preventDefault();const b=document.querySelector('[data-act="sadd"]');if(b)b.click()}});
document.addEventListener('change',ev=>{

  if(ev.target.id==='comp'){const eid=ev.target.dataset.e;ev.target.blur();rsvp(eid,me,optsOf(S.events[eid])[0],Number(ev.target.value))}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault(); if(!db) return;
  const g=id=>$('#'+id).value.trim();
  if(ev.target.id==='pwForm'){
    const v=$('#pw').value;try{await api({op:'pw',pw:v});S.unlocked=true;S.pwVal=v;const f=S.pw;S.pw=null;say('');f()}catch(x){say(x.code==='bad_pw'?'密碼不正確。':'連不上資料，請再試一次。');$('#pw').value=''}
    return}
  if(ev.target.id==='soloForm'){
    const who=g('s_who'),title=g('s_title'); if(!who||!title) return;
    try{await db.collection('solos').add({eventId:ev.target.dataset.e,by:me||'',performers:who,title,at:Date.now()});say('');render(true)}catch(x){fail(x)}
    return}
  if(ev.target.id==='evForm'){
    const pend=g('f_song'); if(pend)(S.form.songs||(S.form.songs=[])).push(pend);
    const data={title:g('f_title'),unit:g('f_unit'),inviter:g('f_inviter'),date:g('f_date'),gather:g('f_gather'),start:g('f_start'),end:g('f_end'),place:g('f_place'),companion:g('f_companion')==='1',songNote:g('f_songNote'),dressF:g('f_dressF'),dressM:g('f_dressM'),songs:S.form.songs||[],allowSolo:g('f_allowSolo')==='1',note:g('f_note'),kind:g('f_kind')||'show',options:(o=>o.join()==='參加,請假'?[]:o)(splitOpts(g('f_options')))};
    if(!data.title||!data.date) return;
    try{const ref=S.form.id?db.doc('events/'+S.form.id):db.collection('events').doc();await ref.set(data);if(!S.form.id){try{localStorage.removeItem('sax-draft')}catch(e){}}S.form=null;S.detail=ref.id;markSeen(ref.id);say('');render(true)}catch(x){fail(x)}
  }
  if(ev.target.id==='memForm'){
    const name=g('m_name'); if(!name) return;
    if(memList().some(m=>m.name===name)){say('名單裡已經有「'+name+'」。');return}
    try{await db.collection('members').add({name,order:Date.now()});say('');$('#m_name').value='';render(true)}catch(x){fail(x)}
  }
});
async function boot(){
  render(true);
  if(!API){S.loaded=true;view.innerHTML='<p class="note">尚未設定資料來源。</p>';return}
  try{const c=JSON.parse(localStorage.getItem('sax-cache')||'null');if(c){for(const k of ['events','members','rsvps','solos','buys','orders']){const o={};(c[k]||[]).forEach(x=>o[x.id]=x);S[k]=o}initSeen();S.loaded=true;render(true)}}catch(e){}
  await load();
  setInterval(()=>{if(!document.hidden&&!pending)load()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!pending)load()});
}
boot();
})();
